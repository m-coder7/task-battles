<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Upcoming Events</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a1a;
      color: #fff;
      padding: 16px;
      width: 100%; height: 100%;
    }
    h1 { font-size: 14px; color: #FF9500; margin-bottom: 12px; }
    .event { font-size: 13px; padding: 4px 0; border-bottom: 1px solid #333; }
  </style>
</head>
<body>
  <h1>Upcoming</h1>
  <div id="events">Loading...</div>
  <script>
    function render() {
      try {
        const key = Object.keys(localStorage).find(k => k.startsWith('planner_events_')) || 'planner_events_anon';
        const events = JSON.parse(localStorage.getItem(key) || '[]');
        const today = new Date().toISOString().slice(0, 10);
        const now = new Date();
        const nowMin = now.getHours() * 60 + now.getMinutes();
        const upcoming = events
          .filter(e => {
            if (e.date > today) return true;
            if (e.date === today && !e.allDay) {
              const [h, m] = (e.startTime || '00:00').split(':').map(Number);
              return h * 60 + m >= nowMin;
            }
            return false;
          })
          .sort((a, b) => {
            if (a.date !== b.date) return a.date.localeCompare(b.date);
            return (a.startTime || '').localeCompare(b.startTime || '');
          })
          .slice(0, 6);
        const container = document.getElementById('events');
        if (!upcoming.length) {
          container.innerHTML = '<div class="event">No upcoming events</div>';
          return;
        }
        container.innerHTML = upcoming.map(e => {
          const d = new Date(e.date + 'T00:00:00');
          const fmt = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
          return `<div class="event">${e.title} — ${fmt} ${e.allDay ? '' : e.startTime}</div>`;
        }).join('');
      } catch (e) {
        document.getElementById('events').innerHTML = '<div class="event">Error: ' + e.message + '</div>';
      }
    }
    render();
    setInterval(render, 3000);
    window.addEventListener('storage', render);
  </script>
</body>
</html>
