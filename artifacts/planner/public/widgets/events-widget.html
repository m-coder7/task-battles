<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upcoming Events</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: rgba(10, 10, 10, 0.72);
      backdrop-filter: blur(16px) saturate(1.4);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      color: #e5e5e5;
      padding: 14px;
      width: 100%; height: 100%;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .drag-handle {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 28px;
      cursor: grab;
      -webkit-app-region: drag;
      z-index: 10;
    }
    .header {
      font-size: 11px;
      font-weight: 700;
      color: #FF9500;
      margin-bottom: 10px;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      user-select: none;
    }
    .event {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 12px;
    }
    .event:last-child { border-bottom: none; }
    .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .time { font-size: 10px; color: rgba(255,255,255,0.4); flex-shrink: 0; }
    .empty { font-size: 12px; color: rgba(255,255,255,0.3); text-align: center; padding: 16px 0; }
  </style>
</head>
<body>
  <div class="drag-handle"></div>
  <div class="header">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FF9500" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    Upcoming
  </div>
  <div id="events"></div>
  <script>
    function getEventsKey() {
      const keys = Object.keys(localStorage).filter(k => k.startsWith('planner_events_'));
      return keys.length ? keys[0] : 'planner_events_anon';
    }
    function getEvents() {
      try { return JSON.parse(localStorage.getItem(getEventsKey()) || '[]'); }
      catch { return []; }
    }
    const COLOR_HEX = {
      red: '#ef4444', orange: '#f97316', yellow: '#eab308',
      green: '#22c55e', blue: '#3b82f6', purple: '#a855f7',
      pink: '#ec4899', gray: '#9ca3af',
    };
    function fmt(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const today = new Date();
      today.setHours(0,0,0,0);
      if (d.getTime() === today.getTime()) return 'Today';
      const tmr = new Date(today); tmr.setDate(tmr.getDate() + 1);
      if (d.getTime() === tmr.getTime()) return 'Tomorrow';
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }
    function render() {
      const events = getEvents();
      const today = new Date().toISOString().slice(0, 10);
      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const upcoming = events
        .filter(e => {
          if (e.date > today) return true;
          if (e.date === today && !e.allDay) {
            const [h, m] = (e.startTime || '00:00').split(':').map(Number);
            return h * 60 + m >= nowMin;
          }
          return false;
        })
        .sort((a, b) => {
          if (a.date !== b.date) return a.date.localeCompare(b.date);
          return (a.startTime || '').localeCompare(b.startTime || '');
        })
        .slice(0, 6);
      const container = document.getElementById('events');
      if (!upcoming.length) {
        container.innerHTML = '<div class="empty">No upcoming events</div>';
        return;
      }
      container.innerHTML = upcoming.map(e => {
        const color = COLOR_HEX[e.color] || '#FF9500';
        return `<div class="event">
          <div class="dot" style="background:${color}"></div>
          <div class="title">${e.title}</div>
          <div class="time">${fmt(e.date)} ${e.allDay ? '' : e.startTime}</div>
        </div>`;
      }).join('');
    }
    render();
    setInterval(render, 3000);
    window.addEventListener('storage', render);
  </script>
</body>
</html>
