<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rivalry Score</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #f2f2f2;
      padding: 12px;
      width: 100%; height: 100%;
    }
    .header { font-size: 12px; font-weight: 600; color: #FF9500; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
    .bar-wrap { height: 8px; background: #222; border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .bar { height: 100%; background: #FF9500; border-radius: 4px; transition: width 0.3s; }
    .empty { font-size: 12px; color: #737373; text-align: center; padding: 12px 0; }
  </style>
</head>
<body>
  <div class="header">Rivalry</div>
  <div id="rivalry"></div>
  <script>
    function render() {
      const keys = Object.keys(localStorage).filter(k => k.startsWith('rivalry_profile_'));
      const profile = keys.length ? JSON.parse(localStorage.getItem(keys[0]) || 'null') : null;
      const rkeys = Object.keys(localStorage).filter(k => k.startsWith('rivalry_rival_code_'));
      const rivalCode = rkeys.length ? localStorage.getItem(rkeys[0]) : null;
      const container = document.getElementById('rivalry');
      if (!profile) {
        container.innerHTML = '<div class="empty">Set up rivalry in the app</div>';
        return;
      }
      const myRate = 0; // widgets cannot access Supabase directly; this is a placeholder
      container.innerHTML = `
        <div class="row"><span>${profile.displayName}</span><span>--%</span></div>
        <div class="row"><span>${rivalCode ? 'Rival' : 'No rival'}</span><span>--%</span></div>
        <div class="bar-wrap"><div class="bar" style="width: 0%"></div></div>
      `;
    }
    render();
  </script>
</body>
</html>
