<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Daily Progress</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a1a;
      color: #fff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      width: 100%; height: 100%;
      padding: 16px;
    }
    h1 { font-size: 14px; color: #FF9500; margin-bottom: 8px; }
    .pct { font-size: 28px; font-weight: bold; color: #FF9500; }
    .sub { font-size: 12px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Daily Progress</h1>
  <div class="pct" id="pct">0%</div>
  <div class="sub" id="sub">0 / 0</div>
  <script>
    function render() {
      try {
        const key = Object.keys(localStorage).find(k => k.startsWith('planner_goals_')) || 'planner_goals_anon';
        const goals = JSON.parse(localStorage.getItem(key) || '[]');
        const today = new Date().toISOString().slice(0, 10);
        const active = goals.filter(g => {
          if (!g.repeat || g.repeat === 'none') return g.date === today;
          if (g.repeat === 'daily') return true;
          const dow = new Date().getDay();
          if (g.repeat === 'weekdays') return dow >= 1 && dow <= 5;
          if (g.repeat === 'weekly') return new Date(g.date).getDay() === dow;
          if (g.repeat === 'custom') return (g.repeatDays || []).includes(dow);
          return false;
        });
        const done = active.filter(g => g.completed || (g.completedDates || []).includes(today)).length;
        const total = active.length || 1;
        const pct = Math.round((done / total) * 100);
        document.getElementById('pct').textContent = pct + '%';
        document.getElementById('sub').textContent = done + ' / ' + total;
      } catch (e) {
        document.getElementById('pct').textContent = 'Err';
      }
    }
    render();
    setInterval(render, 3000);
    window.addEventListener('storage', render);
  </script>
</body>
</html>
