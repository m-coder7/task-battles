<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Today's Tasks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      padding: 14px;
      width: 100%; height: 100%;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    .header {
      font-size: 11px;
      font-weight: 700;
      color: #FF9500;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: drag;
    }
    .task {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #222;
      font-size: 12.5px;
      -webkit-app-region: no-drag;
    }
    .task:last-child { border-bottom: none; }
    .checkbox {
      width: 14px; height: 14px;
      border: 2px solid #FF9500;
      border-radius: 3px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .checkbox.done { background: #FF9500; }
    .checkbox.done::after {
      content: '';
      width: 6px; height: 3px;
      border-left: 2px solid #0f0f0f;
      border-bottom: 2px solid #0f0f0f;
      transform: rotate(-45deg);
    }
    .title { flex: 1; }
    .title.done { text-decoration: line-through; opacity: 0.45; }
    .empty { font-size: 12px; color: #666; text-align: center; padding: 16px 0; }
    .meta {
      font-size: 10px;
      color: #666;
      margin-top: 8px;
      text-align: center;
      -webkit-app-region: drag;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FF9500" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    Today's Tasks
  </div>
  <div id="tasks"></div>
  <div id="meta" class="meta"></div>
  <script>
    function getGoalsKey() {
      const keys = Object.keys(localStorage).filter(k => k.startsWith('planner_goals_'));
      return keys.length ? keys[0] : 'planner_goals_anon';
    }
    function getGoals() {
      try { return JSON.parse(localStorage.getItem(getGoalsKey()) || '[]'); }
      catch { return []; }
    }
    function isGoalActiveToday(g) {
      const today = new Date().toISOString().slice(0, 10);
      const dow = new Date().getDay();
      if (!g.repeat || g.repeat === 'none') return g.date === today;
      if (g.repeat === 'daily') return true;
      if (g.repeat === 'weekdays') return dow >= 1 && dow <= 5;
      if (g.repeat === 'weekly') return new Date(g.date).getDay() === dow;
      if (g.repeat === 'custom') return (g.repeatDays || []).includes(dow);
      return false;
    }
    function isGoalDone(g) {
      const today = new Date().toISOString().slice(0, 10);
      if (g.completed) return true;
      if (Array.isArray(g.completedDates) && g.completedDates.includes(today)) return true;
      return false;
    }
    function render() {
      const goals = getGoals().filter(isGoalActiveToday);
      const container = document.getElementById('tasks');
      const meta = document.getElementById('meta');
      if (!goals.length) {
        container.innerHTML = '<div class="empty">No goals for today</div>';
        meta.textContent = '';
        return;
      }
      const done = goals.filter(isGoalDone).length;
      meta.textContent = `${done}/${goals.length} completed`;
      container.innerHTML = goals.slice(0, 8).map(g => {
        const completed = isGoalDone(g);
        return `<div class="task">
          <div class="checkbox ${completed ? 'done' : ''}"></div>
          <div class="title ${completed ? 'done' : ''}">${g.title}</div>
        </div>`;
      }).join('');
    }
    render();
    setInterval(render, 5000);
    window.addEventListener('storage', render);
  </script>
</body>
</html>
