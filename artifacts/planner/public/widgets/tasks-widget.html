<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Today's Tasks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a1a;
      color: #fff;
      padding: 16px;
      width: 100%; height: 100%;
    }
    h1 { font-size: 14px; color: #FF9500; margin-bottom: 12px; }
    .task { font-size: 13px; padding: 4px 0; border-bottom: 1px solid #333; }
    .task.done { text-decoration: line-through; opacity: 0.5; }
  </style>
</head>
<body>
  <h1>Today's Tasks</h1>
  <div id="tasks">Loading...</div>
  <script>
    function render() {
      try {
        const key = Object.keys(localStorage).find(k => k.startsWith('planner_goals_')) || 'planner_goals_anon';
        const goals = JSON.parse(localStorage.getItem(key) || '[]');
        const today = new Date().toISOString().slice(0, 10);
        const container = document.getElementById('tasks');
        if (!goals.length) {
          container.innerHTML = '<div class="task">No goals</div>';
          return;
        }
        const todayGoals = goals.filter(g => {
          if (!g.repeat || g.repeat === 'none') return g.date === today;
          if (g.repeat === 'daily') return true;
          const dow = new Date().getDay();
          if (g.repeat === 'weekdays') return dow >= 1 && dow <= 5;
          if (g.repeat === 'weekly') return new Date(g.date).getDay() === dow;
          if (g.repeat === 'custom') return (g.repeatDays || []).includes(dow);
          return false;
        });
        if (!todayGoals.length) {
          container.innerHTML = '<div class="task">No goals for today</div>';
          return;
        }
        container.innerHTML = todayGoals.map(g => {
          const done = g.completed || (g.completedDates || []).includes(today);
          return `<div class="task ${done ? 'done' : ''}">${g.title}</div>`;
        }).join('');
      } catch (e) {
        document.getElementById('tasks').innerHTML = '<div class="task">Error: ' + e.message + '</div>';
      }
    }
    render();
    setInterval(render, 3000);
    window.addEventListener('storage', render);
  </script>
</body>
</html>
